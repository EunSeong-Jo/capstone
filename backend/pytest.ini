[pytest]
testpaths = tests
asyncio_mode = auto
# 세션 스코프 픽스처(client)가 함수 스코프 이벤트 루프와 맞물리지 않도록
asyncio_default_fixture_loop_scope = session
addopts = -q --strict-markers
# tests/unit         DB·Redis 없이 도는 테스트 (순수 계산, 외부 호출은 가짜로 바꿈)
# tests/integration  DB·Redis가 있어야 하는 테스트 (API 호출, 조회·쓰기)
# 폴더에 따라 conftest.py가 마커를 붙인다 → pytest tests/unit 또는 pytest -m unit
markers =
    unit: DB·Redis 없이 도는 테스트 (tests/unit)
    integration: DB·Redis가 있어야 하는 테스트 (tests/integration)
